<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cidade Emotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app" aria-hidden="true">
        <section class="menu">
            <header class="hero">
                <div class="hero-art"></div>
                <h1>Cidade Tycoon</h1>
            </header>

            <section class="meta">
                <div>
                    <p id="category" class="category">Emotes</p>
                    <p id="count" class="count">0 / 0</p>
                </div>
            </section>

            <section class="search">
                <span>Buscar</span>
                <input id="search-input" type="search" placeholder="Digite para filtrar" autocomplete="off">
            </section>

            <nav id="tabs" class="tabs"></nav>
            <section id="list" class="list"></section>
            <footer id="command" class="command">/e</footer>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
