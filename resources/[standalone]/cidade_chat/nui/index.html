<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cidade Tycoon - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="chat-container">
            <div id="messages-container">
                <!-- Mensagens entram aqui -->
            </div>
            <div id="input-container" class="hidden">
                <div class="input-wrapper">
                    <span class="input-prefix">></span>
                    <input type="text" id="chat-input" placeholder="Digite uma mensagem ou comando..." spellcheck="false" autocomplete="off">
                </div>
                <div class="input-hints">
                    <small>ENTER para enviar</small>
                    <small>ESC para cancelar</small>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
